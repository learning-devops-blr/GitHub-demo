name: Jobs and Steps Demo

on:
  push:
    branches:
      - main

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Say Hello
        run: echo "Hello from Job 1"

      - name: Show files
        run: ls -la

  system-info:
    needs: hello
    runs-on: ubuntu-latest

    steps:
      - name: Show operating system
        run: uname -a

      - name: Show runner
        run: echo "This is Job 2"
